<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="aurora1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#090d16" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#030712"/>
  <rect width="1920" height="1080" fill="url(#aurora1)"/>
  <rect width="1920" height="1080" fill="url(#aurora2)"/>

  <!-- Glowing organic nebula waves -->
  <ellipse cx="600" cy="500" rx="400" ry="250" fill="#10b981" opacity="0.15" filter="url(#blurFilter)"/>
  <ellipse cx="1300" cy="650" rx="450" ry="220" fill="#06b6d4" opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Constellation Nodes & Code Hexagons -->
  <g stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <polygon points="960,300 1020,335 1020,405 960,440 900,405 900,335"/>
    <circle cx="960" cy="300" r="3" fill="#34d399"/>
    <circle cx="1020" cy="335" r="3" fill="#34d399"/>
    <circle cx="1020" cy="405" r="3" fill="#34d399"/>
    <circle cx="960" cy="440" r="3" fill="#34d399"/>
    <circle cx="900" cy="405" r="3" fill="#34d399"/>
    <circle cx="900" cy="335" r="3" fill="#34d399"/>
    <line x1="960" y1="440" x2="960" y2="520"/>
    <circle cx="960" cy="520" r="4" fill="#00ff88"/>
  </g>

  <text x="960" y="600" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" fill="#ffffff" fill-opacity="0.08" letter-spacing="8">ADRIEL OS // AURORA</text>
</svg>
