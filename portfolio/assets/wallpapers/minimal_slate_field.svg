<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#slateGrad)"/>
  <rect width="1920" height="1080" fill="url(#centerLight)"/>

  <!-- Minimalist stadium perspective lines -->
  <g stroke="#10b981" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <ellipse cx="960" cy="540" rx="600" ry="280"/>
    <ellipse cx="960" cy="540" rx="420" ry="190"/>
    <ellipse cx="960" cy="540" rx="240" ry="110"/>
    <line x1="960" y1="260" x2="960" y2="820"/>
    <line x1="360" y1="540" x2="1560" y2="540"/>
  </g>

  <!-- Monogram Watermark -->
  <g transform="translate(960, 540) scale(1.4)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#10b981" fill-opacity="0.3" text-anchor="middle">AOS</text>
  </g>
</svg>
