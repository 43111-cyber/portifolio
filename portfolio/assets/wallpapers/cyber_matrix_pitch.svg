<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="50%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0, 255, 136, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="960" cy="540" r="600" fill="url(#glow)"/>

  <!-- Subtle Football Pitch & Geometric Tactical Lines -->
  <g stroke="#00ff88" stroke-opacity="0.3" stroke-width="2" fill="none">
    <!-- Pitch boundary -->
    <rect x="360" y="200" width="1200" height="680" rx="16" stroke-dasharray="8 6"/>
    <!-- Half-way line -->
    <line x1="960" y1="200" x2="960" y2="880"/>
    <!-- Center circle -->
    <circle cx="960" cy="540" r="140"/>
    <circle cx="960" cy="540" r="4" fill="#00ff88" fill-opacity="0.8"/>
    
    <!-- Left Penalty Area -->
    <rect x="360" y="360" width="220" height="360"/>
    <rect x="360" y="440" width="90" height="200"/>
    <path d="M 580 480 A 100 100 0 0 1 580 600"/>
    <circle cx="510" cy="540" r="4" fill="#00ff88"/>

    <!-- Right Penalty Area -->
    <rect x="1340" y="360" width="220" height="360"/>
    <rect x="1470" y="440" width="90" height="200"/>
    <path d="M 1340 480 A 100 100 0 0 0 1340 600"/>
    <circle cx="1410" cy="540" r="4" fill="#00ff88"/>
  </g>

  <!-- Digital Code & Circuit Accents -->
  <g font-family="monospace" font-size="14" fill="#00ff88" fill-opacity="0.25">
    <text x="380" y="240">&lt;adriel_os:kernel:init&gt; [OK]</text>
    <text x="380" y="265">const FORMATION = '4-3-3_ATTACK';</text>
    <text x="380" y="290">buildTactics({ speed: 99, creative: true, passion: 'futebol' });</text>
    
    <text x="1220" y="830">SYS_UPTIME: LIVE</text>
    <text x="1220" y="855">ADRIEL MORBACK // DEV &amp; ATHLETE</text>
  </g>
</svg>
